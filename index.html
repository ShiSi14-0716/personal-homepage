<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>施思のホーム ｜ 日日是好日</title>
<meta name="description" content="施思的个人主页：今日学习任务、生活功能、每日一言与待办。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233370FF'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3E施%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
/* ============ 基础（飞书多维表格风） ============ */
:root{
  --bg:#16191D;
  --card:#1E2228;
  --line:#2C313A;
  --line-strong:#3A4150;
  --ink:#E8EAED;
  --ink-2:#B4BCC7;
  --ink-3:#7D8590;
  --blue:#4C7BFF;
  --blue-deep:#6B93FF;
  --blue-bg:rgba(76,123,255,.16);
  --green:#35C724;
  --green-bg:rgba(53,199,36,.14);
  --orange:#FF8B2B;
  --orange-bg:rgba(255,139,43,.14);
  --red:#F55A5A;
  --purple:#8A63D2;
  --cyan:#17CDCD;
  --sans:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);color:var(--ink);line-height:1.7;min-height:100vh;
  background:var(--bg);
}
a{color:inherit}
button{font-family:var(--sans)}
.wrap{max-width:1080px;margin:0 auto;padding:0 26px;position:relative;z-index:1}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ============ 顶栏 ============ */
.topbar{display:flex;align-items:center;gap:14px;padding:20px 0 6px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-size:1.15rem;font-weight:700;color:var(--ink)}
.logo-mark{
  width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:.95rem;font-weight:700;
  background:var(--blue);box-shadow:0 2px 8px rgba(51,112,255,.3);
}
.logo span:last-child{color:var(--ink-2);font-weight:500}
.top-meta{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:8px;
  background:var(--card);border:1px solid var(--line);font-size:.84rem;color:var(--ink-2);white-space:nowrap;
}
.chip .num{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.chip svg{width:14px;height:14px;color:var(--orange);flex:none}

/* ============ 主功能区 ============ */
.hero{
  position:relative;margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:clamp(26px,4.5vw,44px) clamp(24px,4.5vw,44px);overflow:hidden;
}
.hero::before{
  content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--blue),#6FA3FF);
}
.hero-kicker{font-size:.78rem;letter-spacing:.32em;color:var(--blue);font-weight:700}
.hero-title{
  font-size:clamp(1.8rem,4.5vw,2.6rem);font-weight:900;margin-top:10px;line-height:1.35;color:var(--ink);
  letter-spacing:.01em;
}
.hero-sub{color:var(--ink-2);font-size:.98rem;margin-top:6px}
.mission{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px}
.m-btn{
  display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:10px;text-decoration:none;
  font-weight:600;font-size:.94rem;border:1px solid var(--line);background:var(--card);color:var(--ink);
  transition:border-color .2s,box-shadow .2s,transform .15s;
}
.m-btn:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(51,112,255,.12);transform:translateY(-1px)}
.m-btn:active{transform:translateY(1px)}
.m-btn .mi{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.m-btn .mi svg{width:19px;height:19px}
.m-btn small{display:block;font-weight:400;color:var(--ink-3);font-size:.76rem;margin-top:1px}
.mi.blue{background:var(--blue)}
.mi.orange{background:var(--orange)}
.mi.green{background:var(--green)}
.stat-row{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.stat-chip{
  display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;text-decoration:none;
  background:var(--bg);border:1px solid var(--line);color:var(--ink-2);font-size:.85rem;font-weight:500;
  transition:border-color .2s,background .2s;
}
.stat-chip:hover{border-color:var(--blue);background:var(--blue-bg)}
.stat-chip .s-ic{width:15px;height:15px;color:var(--blue)}
.stat-chip b{font-size:1.05rem;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.stat-chip .u{color:var(--ink-3)}

/* ============ 区块标题 ============ */
.sec-head{display:flex;align-items:center;gap:10px;margin:36px 0 14px}
.sec-title{font-size:1.1rem;font-weight:700;color:var(--ink)}
.sec-count{margin-left:auto;font-size:.8rem;color:var(--ink-3)}

/* ============ 快捷入口 ============ */
.speed{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.app-item{
  display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 12px 16px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:inherit;
  transition:border-color .2s,box-shadow .2s,transform .15s;
}
.app-item:hover{border-color:var(--line-strong);box-shadow:0 8px 22px rgba(0,0,0,.45);transform:translateY(-2px)}
.icon-tile{display:grid;place-items:center;color:#fff}
.tile-blue{background:var(--blue)}
.tile-orange{background:var(--orange)}
.tile-green{background:var(--green)}
.tile-purple{background:var(--purple)}
.app-item .icon-tile{width:46px;height:46px;border-radius:10px;margin-bottom:0}
.app-item .icon-tile svg{width:22px;height:22px}
.app-item .txt{font-size:.9rem;font-weight:600;color:var(--ink);white-space:nowrap}

/* ============ 今日能量站 ============ */
.widgets{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;align-items:stretch}
.widget{
  display:flex;flex-direction:column;gap:14px;padding:20px 20px 18px;background:var(--card);
  border:1px solid var(--line);border-radius:10px;
}
.w-head{display:flex;align-items:center;gap:9px;font-size:.98rem;font-weight:700;color:var(--ink)}
.w-icon{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.w-icon svg{width:15px;height:15px}
.w-icon.blue{background:var(--blue)}
.w-icon.pink{background:var(--red)}
.w-icon.yellow{background:var(--orange)}
.w-tag{margin-left:auto;font-size:.7rem;letter-spacing:.18em;color:var(--ink-3);font-weight:500}
.q-refresh{
  width:26px;height:26px;flex:none;border:1px solid var(--line);border-radius:7px;
  background:var(--card);color:var(--ink-2);cursor:pointer;display:grid;place-items:center;
  transition:all .25s;
}
.q-refresh:hover{color:var(--blue);border-color:var(--blue);transform:rotate(180deg)}
.q-refresh:active{transform:rotate(180deg) scale(.9)}
.q-refresh svg{width:14px;height:14px}
.q-refresh.spin{animation:qspin .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes qspin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.quote-note .pt{color:var(--blue);font-weight:500}

/* 每日一言 */
.quote-body{display:flex;flex-direction:column;justify-content:center;flex:1}
.quote-jp{font-size:1.22rem;font-weight:700;line-height:2.05;color:var(--ink)}
.quote-jp ruby{font-weight:700}
.quote-jp rt{font-size:.5em;font-weight:500;color:var(--ink-2);letter-spacing:0}
.quote-zh{color:var(--ink-3);font-size:.88rem;margin-top:10px}
.quote-note{font-size:.74rem;color:var(--ink-3);margin-top:16px}

/* 今日待办 */
.todo-input{display:flex;gap:8px}
.todo-input input{
  flex:1;min-height:40px;padding:8px 13px;border:1px solid var(--line-strong);border-radius:8px;
  background:var(--card);color:var(--ink);font-family:var(--sans);font-size:.9rem;transition:border-color .2s;
}
.todo-input input::placeholder{color:var(--ink-3)}
.todo-input input:focus{outline:none;border-color:var(--blue)}
.todo-add{
  width:44px;min-height:44px;flex:none;border:none;border-radius:8px;cursor:pointer;color:#fff;
  background:var(--blue);display:grid;place-items:center;transition:background .2s;
}
.todo-add:hover{background:var(--blue-deep)}
.todo-add:active{transform:translateY(1px)}
.todo-add svg{width:17px;height:17px}
.todo-progress{display:flex;align-items:center;gap:10px}
.todo-bar{flex:1;height:6px;background:#333A45;border-radius:99px;overflow:hidden}
.todo-bar span{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .35s}
.todo-count{font-size:.78rem;color:var(--ink-3);white-space:nowrap}
.todo-count b{color:var(--green);font-weight:700}
.todo-list{list-style:none;margin-top:2px;flex:1}
.todo-empty{color:var(--ink-3);font-size:.85rem;padding:14px 2px;text-align:center}
.todo-item{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px dashed var(--line);animation:slideIn .28s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.todo-check{
  width:18px;height:18px;flex:none;border:1.5px solid var(--line-strong);border-radius:5px;background:var(--card);
  cursor:pointer;display:grid;place-items:center;color:transparent;transition:all .2s;
}
.todo-check svg{width:11px;height:11px}
.todo-item.done .todo-check{background:var(--green);border-color:var(--green);color:#fff}
.todo-item.done .todo-text{color:var(--ink-3);text-decoration:line-through;text-decoration-color:rgba(134,144,156,.6)}
.todo-text{flex:1;font-size:.9rem;word-break:break-all}
.todo-del{
  width:24px;height:24px;border:none;background:transparent;color:var(--ink-3);cursor:pointer;border-radius:6px;
  display:grid;place-items:center;opacity:0;transition:all .2s;
}
.todo-del svg{width:14px;height:14px}
.todo-item:hover .todo-del{opacity:1}
.todo-del:hover{color:var(--red);background:rgba(245,63,63,.08)}
.todo-done-all{margin-top:auto;padding-top:10px;font-size:.82rem;color:var(--green);text-align:center;display:none;font-weight:600}

/* ============ 页脚 ============ */
footer{margin-top:48px;padding:26px 0 36px;text-align:center;position:relative;z-index:1}
.foot-line{font-size:1rem;font-weight:700;color:var(--ink)}
.foot-line b{color:var(--blue);font-weight:900}
footer .line2{color:var(--ink-3);font-size:.8rem;margin-top:4px}
.foot-export{
  margin-top:14px;min-height:40px;padding:8px 16px;border-radius:8px;border:1px solid var(--line-strong);background:var(--card);
  color:var(--ink-2);font-size:.8rem;cursor:pointer;transition:all .2s;font-family:var(--sans);
}
.foot-export:hover{border-color:var(--blue);color:var(--blue)}

/* ============ Toast ============ */
#toast{
  position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);z-index:99;
  background:#2F3640;color:#EDEFF2;padding:11px 24px;border-radius:8px;font-size:.86rem;font-weight:500;
  border:1px solid var(--line);
  opacity:0;pointer-events:none;transition:all .3s;box-shadow:0 8px 24px rgba(0,0,0,.5);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ 响应式 ============ */
@media(max-width:960px){
  .mission{grid-template-columns:1fr}
  .widgets{grid-template-columns:1fr 1fr}
}
@media(max-width:820px){
  .speed{grid-template-columns:repeat(4,1fr);gap:10px}
  .app-item{padding:16px 6px 12px}
  .app-item .icon-tile{width:40px;height:40px}
  .app-item .icon-tile svg{width:19px;height:19px}
  .app-item .txt{font-size:.78rem}
  .top-meta{margin-left:0;width:100%}
}
@media(max-width:640px){
  .widgets{grid-template-columns:1fr}
  .todo-input input{font-size:16px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<!-- ===== 顶栏 ===== -->
<header class="topbar wrap">
  <div class="logo"><span class="logo-mark">施</span><span>施思のホーム</span></div>
  <div class="top-meta">
    <span class="chip" id="weatherChip" style="display:none">
      <svg id="weatherIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
      <span id="weatherTxt">名古屋 --°</span>
    </span>
    <span class="chip"><span id="dateCn">—</span></span>
    <span class="chip"><span class="num" id="clock">--:--:--</span></span>
  </div>
</header>

<main class="wrap">

  <!-- ===== 主功能区：今日任务 ===== -->
  <section class="hero" id="mission">
    <p class="hero-kicker">TODAY · 今日のミッション</p>
    <h1 class="hero-title" id="greetJp">こんばんは、施思</h1>
    <p class="hero-sub" id="greetZh">晚上好，今天也辛苦了。</p>

    <div class="mission">
      <a class="m-btn" href="https://www.bilibili.com/video/BV16P4y1H7AX/" target="_blank" rel="noopener">
        <span class="mi blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l6 3.5-6 3.5z" fill="currentColor" stroke="none"/></svg></span>
        <span>看视频<small>盘词洞 · N5–N1 词汇</small></span>
      </a>
      <a class="m-btn" id="openNotes" href="openindex:" title="一键打开 Excel（本地方式，免弹窗）">
        <span class="mi orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/><path d="M9 7h7M9 11h5"/></svg></span>
        <span>记笔记<small>一键打开 · 文法词汇索引</small></span>
      </a>
      <a class="m-btn" href="https://shisi14-0716.github.io/qwerty-learner/gallery" target="_blank" rel="noopener">
        <span class="mi green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.5 15a9 9 0 1 0 2-9L1 10"/></svg></span>
        <span>复习巩固<small>温故知新 · 睡前过一遍</small></span>
      </a>
    </div>

    <div class="stat-row">
      <a class="stat-chip" href="#todo">
        <svg class="s-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        今日待办 <b id="heroTodo">0</b><span class="u">项</span>
      </a>
    </div>
  </section>

  <!-- ===== 快捷入口 ===== -->
  <section class="sec" id="links">
    <div class="sec-head">
      <span class="sec-title">生活功能</span>
      <span class="sec-count">4 个常用</span>
    </div>
    <div class="speed">
      <a class="app-item" href="https://feishu.doubao.com/sheets/R9fJsTh4NhLsUStfcRvcmpR5nkg" target="_blank" rel="noopener" aria-label="财务控制台">
        <span class="icon-tile tile-orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg></span>
        <span class="txt">财务</span>
      </a>
      <a class="app-item" href="https://shisi14-0716.github.io/luggage-checklist/" target="_blank" rel="noopener" aria-label="行李清单">
        <span class="icon-tile tile-purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M4 13h16"/><path d="M12 10v3"/></svg></span>
        <span class="txt">行李</span>
      </a>
      <a class="app-item" href="https://4m2etm137ge3x.aiforce.cloud/app/app_17e9rbgv28h" target="_blank" rel="noopener" aria-label="日本入境指南">
        <span class="icon-tile tile-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></span>
        <span class="txt">入境</span>
      </a>
      <a class="app-item" href="https://4m2etm137ge3x.aiforce.cloud/app/app_17ea2tcq4k4" target="_blank" rel="noopener" aria-label="名古屋物价目安">
        <span class="icon-tile tile-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span>
        <span class="txt">物价</span>
      </a>
    </div>
  </section>

  <!-- ===== 今日能量站 ===== -->
  <section class="sec" id="energy">
    <div class="sec-head">
      <span class="sec-title">今日能量站</span>
      <span class="sec-count">一言 · 待办</span>
    </div>
    <div class="widgets">

      <div class="widget">
        <div class="w-head">
          <span class="w-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l4-6 4 6"/><path d="M12 12l4-6 4 6"/><path d="M4 12h16v3H4z"/><path d="M5 19h14"/></svg></span>
          每日一言
          <span class="w-tag">ことわざ・名言</span>
          <button class="q-refresh" id="quoteRefresh" aria-label="换一句" title="换一句">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
        </div>
        <div class="quote-body">
          <p class="quote-jp" id="quoteJp">—</p>
          <p class="quote-zh" id="quoteZh">—</p>
          <p class="quote-note" id="quoteNote">今日の一言 · ことわざ</p>
        </div>
      </div>

      <div class="widget" id="todo">
        <div class="w-head">
          <span class="w-icon yellow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>
          今日待办
          <span class="w-tag">メモ</span>
        </div>
        <div class="todo-input">
          <input id="todoInput" type="text" placeholder="写下今天要做的事…" maxlength="60" aria-label="新的待办事项">
          <button class="todo-add" id="todoAdd" aria-label="添加待办">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <div class="todo-progress">
          <div class="todo-bar"><span id="todoBar" style="width:0%"></span></div>
          <span class="todo-count">已完成 <b id="todoDone">0</b>/<span id="todoTotal">0</span></span>

        <ul class="todo-list" id="todoList"></ul>
        <p class="todo-done-all" id="todoDoneAll">今天的待办全部完成，了不起！</p>
      </div>

    </div>
  </section>

</main>

<footer>
  <p class="foot-line">日日是<b>好日</b></p>
  <p class="line2">每一天都是新的开始 · 2026 · 名古屋</p>
  <button class="foot-export" id="exportBtn">导出数据备份</button>

<script>
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };

  /* ---------- 本地存储 ---------- */
  function load(key, def){
    try{ var v = JSON.parse(localStorage.getItem(key)); return v === null ? def : v; }
    catch(e){ return def; }
  }
  function save(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

  /* ---------- 日期工具（本地时区） ---------- */
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function keyOf(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function todayKey(){ return keyOf(new Date()); }

  /* ---------- 时钟与问候 ---------- */
  function greeting(){
    var h = new Date().getHours();
    if(h >= 5 && h < 11) return {jp:"おはよう、施思", zh:"早上好，新的一天从日语开始。"};
    if(h >= 11 && h < 14) return {jp:"こんにちは、施思", zh:"中午好，吃饱了再继续学。"};
    if(h >= 14 && h < 18) return {jp:"こんにちは、施思", zh:"下午好，保持专注，事半功倍。"};
    if(h >= 18 && h < 23) return {jp:"こんばんは、施思", zh:"晚上好，今天也辛苦了。"};
    return {jp:"おやすみ、施思", zh:"夜深了，早点休息，明天继续。"};
  }
  function tick(){
    var now = new Date(), g = greeting();
    $("#greetJp").textContent = g.jp;
    $("#greetZh").textContent = g.zh;
    $("#dateCn").textContent = (now.getMonth()+1) + "月" + now.getDate() + "日 星期" + "日一二三四五六".charAt(now.getDay());
    $("#clock").textContent = pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
  }

  };
  function weatherIcon(code){
    if(code === 0) return "sun";
    if(code >= 95) return "storm";
    if((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return "rain";
    if((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) return "snow";
    return "cloud";
  }
  function loadWeather(){
    try{
      fetch("https://api.open-meteo.com/v1/forecast?latitude=35.1815&longitude=136.9066&current_weather=true&timezone=Asia%2FTokyo")

        .then(function(d){
          var cw = d && d.current_weather; if(!cw) return;

          $("#weatherTxt").textContent = "名古屋 " + Math.round(cw.temperature) + "° " + (W_CODES[code] || "多云");

          $("#weatherChip").style.display = "inline-flex";

        .catch(function(){});
    }catch(e){}
  }

    {jp:"はたらけどはたらけど猶わが生活楽にならざりぢっと手を見る", f:'はたらけどはたらけど<ruby>猶<rt>なお</rt></ruby>わが<ruby>生活<rt>せいかつ</rt></ruby><ruby>楽<rt>らく</rt></ruby>にならざりぢっと<ruby>手<rt>て</rt></ruby>を<ruby>見<rt>み</rt></ruby>る', zh:"拼命地工作，拼命地工作，生活却依旧困苦，我呆呆地望着自己的手", src:"石川啄木『一握の砂』"},
    {jp:"清水へ祇園をよぎる桜月夜こよひ逢ふ人みなうつくしき", f:'<ruby>清水<rt>きよみず</rt></ruby>へ<ruby>祇園<rt>ぎおん</rt></ruby>をよぎる<ruby>桜月夜<rt>さくらづきよ</rt></ruby>こよひ<ruby>逢<rt>あ</rt></ruby>ふ<ruby>人<rt>ひと</rt></ruby>みなうつくしき', zh:"穿过祇园往清水寺去，樱花开遍的月夜，今夜所遇之人个个都美丽", src:"与謝野晶子『みだれ髪』"},
    {jp:"汚れつちまつた悲しみに今日も小雪の降りかかる", f:'<ruby>汚<rt>よご</rt></ruby>れつちまつた<ruby>悲<rt>かな</rt></ruby>しみに<ruby>今日<rt>きょう</rt></ruby>も<ruby>小雪<rt>こゆき</rt></ruby>の<ruby>降<rt>ふ</rt></ruby>りかかる', zh:"在这沾染了污秽的悲伤之上，今天也飘落着小雪", src:"中原中也『汚れつちまつた悲しみに…』"},
    {jp:"芸術は爆発だ", f:'<ruby>芸術<rt>げいじゅつ</rt></ruby>は<ruby>爆発<rt>ばくはつ</rt></ruby>だ', zh:"艺术就是爆炸", src:"岡本太郎"},
    {jp:"諦めたら、そこで試合終了ですよ。", f:'<ruby>諦<rt>あきら</rt></ruby>めたら、そこで<ruby>試合<rt>しあい</rt></ruby><ruby>終了<rt>しゅうりょう</rt></ruby>ですよ。', zh:"一旦放弃，比赛就结束了。", src:"安西先生『SLAM DUNK』"},
    {jp:"日日是好日", f:'<ruby>日日<rt>にちにち</rt></ruby>は<ruby>好日<rt>こうじつ</rt></ruby>', zh:"每一天，都是好日子", src:"仏教語"},
    {jp:"できるかできないかではなく、やるかやらないか", f:'できるかできないかではなく、やるかやらないか', zh:"问题不是能不能，而是做不做", src:"名言"}
  ];
  var Q_KEY = "home_quote_used";
  function dayOfYear(){
    var n = new Date(); return Math.floor((n - new Date(n.getFullYear(),0,0)) / 864e5);
  }
  function renderQuote(idx, used){
    var q = QUOTES[idx];
    $("#quoteJp").innerHTML = q.f || q.jp;
    $("#quoteZh").textContent = "—— " + q.zh;
    $("#quoteNote").innerHTML = q.src + (q.pt ? ' · <span class="pt">考点：' + q.pt + '</span>' : "");
    save(Q_KEY, used);
  }
  function pickQuote(excludeUsed){
    var used = excludeUsed.slice();
    if(used.length >= QUOTES.length){ used = []; }
    var pool = [];
    for(var i = 0; i < QUOTES.length; i++){ if(used.indexOf(i) === -1) pool.push(i); }
    if(!pool.length) pool = [dayOfYear() % QUOTES.length];
    return { idx: pool[Math.floor(Math.random() * pool.length)], used: used };
  }
  (function(){
    var used = load(Q_KEY, []);
    var idx;
    if(used.length === 0){
      idx = dayOfYear() % QUOTES.length;      // 每日首次打开：当日推荐
      used = [idx];
    } else if(used.length < QUOTES.length){
      var p = pickQuote(used);                  // 非首次：从没用过的里随机
      idx = p.idx; used = p.used.concat([idx]);
    } else {
      idx = dayOfYear() % QUOTES.length; used = [idx];
    }
    renderQuote(idx, used);
  })();
  $("#quoteRefresh").addEventListener("click", function(){
    var used = load(Q_KEY, []);
    var p = pickQuote(used);
    renderQuote(p.idx, p.used.concat([p.idx]));
    var el = $("#quoteRefresh");
    el.classList.add("spin");
    setTimeout(function(){ el.classList.remove("spin"); }, 600);
  });

  /* ---------- 今日待办（按天存储） ---------- */
  var TODO_KEY = "home_todo_" + todayKey();
  function renderTodo(){
    var items = load(TODO_KEY, []);
    var list = $("#todoList"); list.innerHTML = "";
    var done = 0;
    if(!items.length){
      var empty = document.createElement("li");
      empty.className = "todo-empty";
      empty.textContent = "还没有待办，写下今天的第一件事吧";
      list.appendChild(empty);
    }
    items.forEach(function(item){
      if(item.done) done++;
      var li = document.createElement("li");
      li.className = "todo-item" + (item.done ? " done" : "");
      var cb = document.createElement("button");
      cb.className = "todo-check";
      cb.setAttribute("aria-label", item.done ? "标记为未完成" : "标记为完成");
      cb.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
      cb.addEventListener("click", function(){
        items.forEach(function(x){ if(x.id === item.id) x.done = !x.done; });
        save(TODO_KEY, items); renderTodo();
      });
      var txt = document.createElement("span");
      txt.className = "todo-text"; txt.textContent = item.text;
      var del = document.createElement("button");
      del.className = "todo-del";
      del.setAttribute("aria-label", "删除");
      del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
      del.addEventListener("click", function(){
        items = items.filter(function(x){ return x.id !== item.id; });
        save(TODO_KEY, items); renderTodo();
      });
      li.appendChild(cb); li.appendChild(txt); li.appendChild(del);
      list.appendChild(li);
    });
    $("#todoDone").textContent = done;
    $("#todoTotal").textContent = items.length;
    $("#todoBar").style.width = items.length ? (done/items.length*100) + "%" : "0%";
    $("#todoDoneAll").style.display = (items.length && done === items.length) ? "block" : "none";
    $("#heroTodo").textContent = items.length - done;
  }
  function addTodo(){
    var input = $("#todoInput"), v = input.value.trim();
    if(!v){ toast("先写点什么吧"); return; }
    var items = load(TODO_KEY, []);
    items.unshift({ id: Date.now() + Math.random(), text: v, done: false });
    save(TODO_KEY, items);
    input.value = ""; renderTodo();
    toast("已记下 · 言出必行");
  }
  $("#todoAdd").addEventListener("click", addTodo);
  $("#todoInput").addEventListener("keydown", function(e){ if(e.key === "Enter") addTodo(); });

  /* ---------- 导出数据备份 ---------- */
  $("#exportBtn").addEventListener("click", function(){
    try{
      var data = { exportedAt: new Date().toISOString(), todos: {} };
      for(var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if(k && k.indexOf("home_todo_") === 0){ data.todos[k] = load(k, []); }
      }
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "施思主页备份-" + todayKey() + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
      toast("已导出备份文件");
    }catch(e){ toast("导出失败，请重试"); }
  });

  /* ---------- Toast ---------- */
  var toastTimer = null;
  function toast(msg){
    var el = $("#toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2400);
  }

  renderTodo();
})();
</script>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
